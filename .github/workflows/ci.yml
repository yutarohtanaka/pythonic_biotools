name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install scientific test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy pandas anndata pysam scikit-learn requests pytest

      - name: Verify workspace imports and PEP 561 py.typed across all 70 packages
        run: |
          python pythonic_biotools_cli.py check-imports --bundle all

      - name: Run unit tests across all standalone packages
        run: |
          set -euo pipefail
          for test_dir in */tests; do
            pkg_dir="$(dirname "$test_dir")"
            echo "=== Testing ${pkg_dir} ==="
            PYTHONPATH="${pkg_dir}" pytest "${test_dir}" -q
          done

      - name: Run cross-package integration workflows and R_default golden benchmarks
        run: |
          pytest tests_integration benchmarks/r_parity -q
