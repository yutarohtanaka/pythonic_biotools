[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonic-bayesprism"
version = "0.2.0"
description = "Python implementation of BayesPrism Bayesian cell-type deconvolution and expression reconstruction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "anndata>=0.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[tool.setuptools]
packages = ["pythonic_bayesprism"]
