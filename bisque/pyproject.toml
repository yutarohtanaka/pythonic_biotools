[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bisque"
version = "0.1.0"
description = "Clean-room Python implementation of Bisque (Jew et al., Nature Communications 2020) for cross-platform reference-based and marker-based bulk RNA-seq deconvolution"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "anndata>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["bisque*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
