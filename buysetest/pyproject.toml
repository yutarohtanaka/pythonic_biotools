[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "buysetest"
version = "0.1.0"
description = "Python implementation of BuyseTest (Buyse 2010; Peron et al. 2016; Ozenne et al. 2021) and Proportional Win-Fractions Regression WR::pwreg (Mao & Wang, JASA 2020) for prioritized composite clinical-trial endpoints"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["buysetest*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
