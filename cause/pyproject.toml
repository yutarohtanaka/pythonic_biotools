[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cause"
version = "0.1.0"
description = "Python implementation of CAUSE (Morrison et al., Nature Genetics 2020) for Mendelian randomization with correlated and uncorrelated horizontal pleiotropy"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-3.0-or-later"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cause*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
