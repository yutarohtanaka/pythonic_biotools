[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chord"
version = "0.1.0"
description = "Clean-room Python implementation of CHORD and mutSigExtractor (Nguyen et al., Nature Communications 2020) for pan-cancer HRD detection and BRCA1-type vs BRCA2-type classification"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "pysam>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["chord*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
