[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pythonic-chromvar"
version = "0.1.0"
description = "ChromVAR raw-count motif accessibility deviations, bridge harmonization, TF-RNA concordance, and PWM scanning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[project.optional-dependencies]
pychromvar = ["anndata>=0.10", "pychromvar>=0.0.4", "pyjaspar>=3.0"]

[tool.hatch.build.targets.wheel]
packages = ["chromvar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
