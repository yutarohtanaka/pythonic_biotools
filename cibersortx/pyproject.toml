[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cibersortx"
version = "0.1.0"
description = "Clean-room Python implementation of CIBERSORT and CIBERSORTx (Newman et al., Nat Methods 2015; Nat Biotechnol 2019)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "anndata>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cibersortx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
