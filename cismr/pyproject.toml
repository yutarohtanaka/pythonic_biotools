[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cismr"
version = "0.1.0"
description = "Correlated drug-target cis-Mendelian Randomization: PC-GMM, MV-PC-GMM, MR-SPI, and MR-GENIUS"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cismr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
