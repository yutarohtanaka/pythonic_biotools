[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "colliderbias"
version = "0.1.0"
description = "Python implementation of ColliderBias (Cai et al., 2022; Cai & Dudbridge, 2024): CWLS and CWBLS estimators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["colliderbias"]

[tool.pytest.ini_options]
testpaths = ["tests"]
