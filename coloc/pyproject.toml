[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coloc"
version = "0.1.0"
description = "Python implementation of coloc::coloc.abf Bayesian colocalization (Giambartolomei et al., PLOS Genetics 2014)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["coloc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
