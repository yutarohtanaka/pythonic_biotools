[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "csaw"
version = "0.1.0"
description = "Python implementation of csaw (Lun & Smyth, Nucleic Acids Research 2016) for sliding-window differential ChIP-seq/ATAC-seq binding analysis with Quasi-Likelihood NB GLMs and Simes region-level FDR control"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pysam>=0.21",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["csaw*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
