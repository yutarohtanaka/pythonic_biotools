[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cside"
version = "0.1.0"
description = "Clean-room Python implementation of CSIDE (Cable et al., Nature Methods 2022) for cell-type-specific differential expression in spatial transcriptomics"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "anndata>=0.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["cside*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
