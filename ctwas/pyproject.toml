[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ctwas"
version = "0.1.0"
description = "Clean-room Python implementation of cTWAS (Zhao et al., Nature Genetics 2024) for causal Transcriptome/Proteome-Wide Association Studies via Empirical Bayes and group-prior SuSiE-RSS fine-mapping"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ctwas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
