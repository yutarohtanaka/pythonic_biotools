[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "decoupler-ulm"
version = "0.1.0"
description = "Univariate Linear Model (ULM), log2-dot, and top-k z-score gene-program activity projection"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["decoupler_ulm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
