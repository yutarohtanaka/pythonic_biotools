[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "deqms"
version = "0.1.0"
description = "Python implementation of DEqMS (Zhu et al., Molecular & Cellular Proteomics 2020) for peptide/PSM-count-dependent Empirical Bayes differential protein expression"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["deqms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
