[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dndscv"
version = "0.1.0"
description = "Clean-room Python implementation of dNdScv (Martincorena et al., Cell 2017) maximum-likelihood somatic selection (dN/dS) analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
fasta = ["pysam>=0.21"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dndscv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
