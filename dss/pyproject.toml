[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dss"
version = "0.1.0"
description = "Clean-room Python implementation of DSS (Wu et al. 2013; Feng et al. 2014; Park & Wu 2016) and DMRcate (Peters et al. 2015) for Beta-Binomial Empirical Bayes differential DNA methylation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "anndata>=0.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
