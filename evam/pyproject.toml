[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evam"
version = "0.1.0"
description = "Python implementations of Evolutionary Accumulation Models (Oncotree, OncoBN, CAPRESE, CBN, MHN)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = ["numpy>=1.24", "scipy>=1.11", "pandas>=2.0", "statsmodels>=0.14"]

[project.optional-dependencies]
mhn = ["mhn>=1.2.3"]

[tool.hatch.build.targets.wheel]
packages = ["evam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
