[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "facets"
version = "0.1.0"
description = "Python implementation of FACETS (Shen & Seshan, Nucleic Acids Research 2016) allele-specific somatic copy number, tumor purity, ploidy, and cellular fraction estimation, with ASCAT equations (Van Loo et al., PNAS 2010)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["facets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
