[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "figr"
version = "0.1.0"
description = "Python implementation of FigR (Kartha et al., Cell Genomics 2022) for cis peak-to-gene links, DORCs, and TF-DORC gene regulatory networks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "anndata>=0.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["figr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
