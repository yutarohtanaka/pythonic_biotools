[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genomicsem"
version = "0.1.0"
description = "Python implementation of GenomicSEM (Grotzinger et al., Nature Human Behaviour 2019) for structural equation modeling and multivariate common-factor GWAS over LDSC genetic covariance matrices"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["genomicsem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
