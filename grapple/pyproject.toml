[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grapple"
version = "0.1.0"
description = "Clean-room Python implementation of GRAPPLE (Wang et al., PNAS 2021) for genome-wide weak-IV robust profile-likelihood MR, multimodal pleiotropic pathway discovery, and overlap-aware MVMR"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["grapple*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
