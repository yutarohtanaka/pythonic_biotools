[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hdl"
version = "0.1.0"
description = "High-Definition Likelihood (HDL, HDL-L, HDL.S) inference of heritability, genetic correlation, and functional enrichment (Ning et al., Nature Genetics 2020)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["hdl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
