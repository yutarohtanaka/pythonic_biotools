[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyprcoloc"
version = "0.1.0"
description = "Python implementation of HyPrColoc multi-trait Bayesian colocalization (Foley et al., Nature Communications 2021)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["hyprcoloc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
