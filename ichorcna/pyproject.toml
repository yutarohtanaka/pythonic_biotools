[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ichorcna"
version = "0.1.0"
description = "Python implementation of ichorCNA (Adalsteinsson et al., Nature Communications 2017) for ultra-low-pass WGS cfDNA tumor fraction and somatic copy-number HMM inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ichorcna*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
