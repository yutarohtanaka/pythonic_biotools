[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "indexevent"
version = "0.1.0"
description = "Python implementation of indexevent (Dudbridge et al., Nature Communications 2019) for CWLS, Hedges-Olkin, and SIMEX index-event bias adjustment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["indexevent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
