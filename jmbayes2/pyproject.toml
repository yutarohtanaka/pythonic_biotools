[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jmbayes2"
version = "0.1.0"
description = "Python implementation of JMbayes2 (Rizopoulos 2012; Papageorgiou et al., Statistics in Medicine 2019) for Bayesian joint longitudinal and survival / competing-risks modeling with dynamic individualized prediction"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["jmbayes2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
