[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lava"
version = "0.1.0"
description = "Python implementation of LAVA (Werme et al., Nature Genetics 2022) for univariate local heritability, bivariate and partial local genetic correlation, and multivariate local genetic multiple regression"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lava*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
