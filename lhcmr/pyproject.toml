[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lhcmr"
version = "0.1.0"
description = "Clean-room Python implementation of LHC-MR (Darrous et al., Nature Communications 2021) for bidirectional causal effect estimation under a latent heritable confounder and sample overlap"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lhcmr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
