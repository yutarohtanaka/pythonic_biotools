[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logistf"
version = "0.1.0"
description = "Python implementation of logistf Firth Jeffreys-prior penalized logistic regression (Heinze & Schemper, 2002)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["logistf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
