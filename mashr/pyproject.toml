[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mashr"
version = "0.1.0"
description = "Clean-room Python implementation of mashr (Urbut et al., Nature Genetics 2019) for data-driven multivariate adaptive shrinkage"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mashr*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
