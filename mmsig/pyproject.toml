[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mmsig"
version = "0.1.0"
description = "Python implementation of mmsig (Rustad et al., Communications Biology 2021) for interpretable mutational signature refitting with backward cosine-similarity pruning, multinomial bootstrap CIs, and transcriptional strand-bias confirmation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mmsig*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
