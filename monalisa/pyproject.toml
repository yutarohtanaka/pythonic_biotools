[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "monalisa"
version = "0.1.0"
description = "Python implementation of monaLisa (Machlab et al., Bioinformatics 2022) for composition-corrected binned motif enrichment and Randomized Lasso Stability Selection"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["monalisa*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
