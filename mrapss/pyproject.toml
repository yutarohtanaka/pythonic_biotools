[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mrapss"
version = "0.1.0"
description = "Python implementation of MR-APSS (Hu et al., Nature Communications 2022) for Mendelian Randomization accounting for pleiotropy and sample structure"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["mrapss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
