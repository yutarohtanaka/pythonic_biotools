[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mrclust"
version = "0.1.0"
description = "Python implementation of MR-Clust (Foley et al., Bioinformatics 2021) for clustered heterogeneity in Mendelian randomization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
plots = ["matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mrclust*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
