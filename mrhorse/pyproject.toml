[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mrhorse"
version = "0.1.0"
description = "Python implementation of MR-Horse and MVMR-Horse (Grant & Burgess, AJHG 2024) for Bayesian Horseshoe Mendelian Randomization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["mrhorse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
