[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mrlap"
version = "0.1.0"
description = "Clean-room Python implementation of MRlap (Mounier & Kutalik, Genetic Epidemiology 2023) for analytical MR bias correction under sample overlap, weak instruments, and Winner's curse"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["mrlap*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
