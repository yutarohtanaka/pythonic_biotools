[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mrraps"
version = "0.1.0"
description = "Python implementation of mr.raps (Zhao et al., Annals of Statistics 2020) for Robust Adjusted Profile Score Mendelian Randomization"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["mrraps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
