[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mtcojo"
version = "0.1.0"
description = "Python implementation of GCTA-mtCOJO and GSMR (Zhu et al., Nature Communications 2018)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["mtcojo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
