[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mvcml"
version = "0.1.0"
description = "Python implementation of MVMR-cML and conditional GWAS bias adjustment (Lin et al., AJHG 2023)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["mvcml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
