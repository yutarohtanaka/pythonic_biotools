[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nebula"
version = "0.1.0"
description = "Python implementation of NEBULA (He et al., Communications Biology 2021) fast negative binomial mixed models for multi-subject single-cell data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "anndata>=0.10",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["nebula*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
