[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "numbat"
version = "0.1.0"
description = "Haplotype-aware single-cell CNV calling and tumor phylogeny reconstruction (Gao et al., Nature Biotechnology 2023)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "anndata>=0.10",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
accel = ["numba>=0.58"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["numbat*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
