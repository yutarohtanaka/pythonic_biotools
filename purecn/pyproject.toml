[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "purecn"
version = "0.1.0"
description = "Clean-room Python implementation of PureCN (Riester et al., Source Code for Biology and Medicine 2016) for tumor-only clinical panel purity/ploidy optimization, somatic-vs-germline classification, LOH, clonality, and TMB"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["purecn*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
