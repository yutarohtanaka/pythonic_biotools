[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pythonic-biotools"
version = "0.2.0"
description = "Workspace meta-package and bundle manager for 70 standalone Python implementations of published R, C++, and Fortran bioinformatics, cancer genomics, clinical trial, and statistical genetics libraries"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
oncology = [
    "pysam>=0.22",
    "scikit-learn>=1.3",
    "anndata>=0.10",
    "requests>=2.31",
]
statgen = [
    "scikit-learn>=1.3",
]
singlecell = [
    "anndata>=0.10",
    "scikit-learn>=1.3",
]
epigenomics = [
    "pysam>=0.22",
    "scikit-learn>=1.3",
    "anndata>=0.10",
]
proteomics = [
    "scikit-learn>=1.3",
]
survival = [
    "scikit-learn>=1.3",
]
all = [
    "anndata>=0.10",
    "pysam>=0.22",
    "scikit-learn>=1.3",
    "requests>=2.31",
]
dev = [
    "anndata>=0.10",
    "pysam>=0.22",
    "scikit-learn>=1.3",
    "requests>=2.31",
    "pytest>=7.4",
]

[project.scripts]
pythonic-biotools = "pythonic_biotools_cli:main"

[tool.setuptools]
py-modules = ["pythonic_biotools_cli"]

[tool.uv.workspace]
members = [
