[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scarhrd"
version = "0.1.0"
description = "Python implementation of scarHRD (Sztupinszki et al., NPJ Breast Cancer 2018) homologous recombination deficiency genomic scar scoring (HRD-LOH, TAI, LST)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["scarhrd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
