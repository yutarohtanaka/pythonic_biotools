[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slopehunter"
version = "0.1.0"
description = "Python implementation of SlopeHunter (Mahmoud et al., Nature Communications 2022) for Gaussian-mixture EM collider-bias adjustment"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.hatch.build.targets.wheel]
packages = ["slopehunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
