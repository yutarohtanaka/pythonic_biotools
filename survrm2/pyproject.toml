[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "survrm2"
version = "0.1.0"
description = "Python implementation of survRM2 (Uno et al., JCO 2014; Tian et al., Biostatistics 2014) for two-sample and covariate-adjusted Restricted Mean Survival Time (RMST) and Restricted Mean Time Lost (RMTL) inference"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["survrm2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
