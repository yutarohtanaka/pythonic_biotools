[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sva"
version = "0.1.0"
description = "Python implementation of Surrogate Variable Analysis (sva, irwsva, twostepsva, svaseq, num_sv, f_pvalue; Leek & Storey 2007; Leek 2014)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
anndata = ["anndata>=0.10"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["sva*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
