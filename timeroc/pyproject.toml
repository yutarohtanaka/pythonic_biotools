[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timeroc"
version = "0.1.0"
description = "IPCW time-dependent ROC curves, AUCs, and IID influence-function inference with competing risks (Blanche et al., Statistics in Medicine 2013)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "GPL-2.0-or-later"}
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["timeroc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
