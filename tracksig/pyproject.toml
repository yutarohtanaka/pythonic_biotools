[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracksig"
version = "0.1.0"
description = "Clean-room Python implementation of TrackSig and TrackSigFreq (Rubanova et al., Nature Communications 2020; Harrigan et al., PSB 2020) for evolutionary pseudotime changepoint segmentation of mutational signatures"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tracksig*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
