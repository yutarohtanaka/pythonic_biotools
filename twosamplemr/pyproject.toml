[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twosamplemr"
version = "0.1.0"
description = "Summary-data Mendelian Randomization (IVW, coding-invariant MR-Egger, Weighted Median, MVMR) and LD clumping"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0"]

[tool.hatch.build.targets.wheel]
packages = ["twosamplemr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
