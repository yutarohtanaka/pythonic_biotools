[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "variancepartition"
version = "0.1.0"
description = "Python implementation of variancePartition and dream mixed-effects modeling, variance decomposition, and Empirical Bayes differential expression (Hoffman & Schadt, BMC Bioinformatics 2016; Hoffman & Roussos, Bioinformatics 2021)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Yutaro Tanaka"}]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
]

[project.optional-dependencies]
anndata = ["anndata>=0.10"]
parallel = ["joblib>=1.3"]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["variancepartition*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
